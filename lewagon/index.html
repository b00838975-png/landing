<!DOCTYPE html>
<html>
  <head>
    <title>Núria Avià's life</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="./css/style.css">

    <style>
      .banner {
    background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url("images/paris.jpeg");
    background-size: cover;
        background-position: center;
        background-color: #333;
        padding: 150px 0px;
        text-align: center;
        margin-bottom: 40px;
      }

      .banner h1 {
        color: white;
        font-family: 'Roboto', sans-serif;
        font-size: 50px;
      }

      .btn-blue {
        background-color: #6D71DD;
        padding: 15px 20px;
        border-radius: 4px;
        color: whitesmoke;
        font-weight: bold;
        font-family: Roboto, sans-serif;
        display: inline-block;
      }

     .card {
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2);
        border-radius: 6px;
        margin: 40px 0; /* Un poco de margen para separarla */
        background-color: white;
      }
      .card img {
        width: 150px;
        border-radius: 6px;
      }
      .card h3 {
        flex-grow: 1;
        padding-left: 20px;
        font-size: 24px;
        margin: 0;
      }

    </style>

  </head>

 <body>

    <div class="banner">
      <div class="container">
        <h1>Travel is life</h1>
        <h2>All these experiences made me the person that I am today</h2>
        <a href="#apply-section" class="btn-blue">Apply now</a>
      </div>
    </div>

    <div class="container">

      <h2>Places I have been</h2>

      <div class="cards">

        <div class="card">
          <img src="images/shangai.jpeg" alt="Shangai picture">
          <h3>Shangai</h3>
        </div>

        <div class="card">
          <img src="images/kuala .jpeg" alt="Kuala picture">
          <h3>Visiting Kuala Lumpur</h3>
        </div>

        <div class="card">
          <img src="images/peru.jpeg" alt="Peru picture">
          <h3>Hiking in Machu Pichu, i met king Mikel II from Zabka</h3>
        </div>

      </div>

    </div>

    <div id="apply-section">
      <div data-tf-live="01M86GBQPVQNQ4W9PMDTPTER9T"></div>
      <script src="https://embed.typeform.com/next/embed.js"></script>
    </div>

  </body>
</html>
